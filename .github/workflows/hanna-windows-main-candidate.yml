name: HANNA Windows R6 main program upgrade - protected candidate

on:
  push:
    branches: [qa/windows-r6-main-candidate-20261123]
    paths: [.github/workflows/hanna-windows-main-candidate.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hanna-windows-main-r6-final-guard
  cancel-in-progress: false

jobs:
  build-test-candidate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ASH_NETWORK_DISABLED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf8
    steps:
      - name: Preserve exact Git blob bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Checkout reviewed Windows main program
        uses: actions/checkout@v4
        with:
          repository: Nrzxl/hanna-conquest-mobile
          ref: 4124465783ba48f85403f713be1f60a2f02f07e5
          token: ${{ secrets.HANNA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private
      - name: Checkout immutable approved R6 resources and runtime
        uses: actions/checkout@v4
        with:
          repository: Nrzxl/hanna-conquest-downloads
          ref: 99835da58af79f783963f9385fad4aab326c9646
          persist-credentials: false
          path: approved_base
      - name: Host Python for verified runtime bootstrap only
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify private source commit
        shell: pwsh
        run: |
          if ((git -C private rev-parse HEAD) -ne '4124465783ba48f85403f713be1f60a2f02f07e5') { throw 'Source pin mismatch' }
      - name: Compile full Setup and validate affected tests, upgrade, rollback and uninstall
        shell: pwsh
        run: python -B private/windows-sync-integration-qa/main_candidate/official/ci_official.py
      - name: Upload protected candidate artifact only - no Release or OTA
        uses: actions/upload-artifact@v4
        with:
          name: HANNA-R6-26.1.11-Main-Program-Upgrade-Review
          path: official-delivery/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve sanitized build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HANNA-R6-Main-Upgrade-Diagnostics
          path: official-build/official/reports/
          if-no-files-found: warn
          retention-days: 7
