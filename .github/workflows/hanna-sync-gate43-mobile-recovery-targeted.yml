name: HANNA Sync Gate 4.3 - Mobile offline recovery targeted QA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hanna-sync-gate43-mobile-recovery-targeted.yml

permissions:
  contents: read

concurrency:
  group: hanna-sync-gate43-mobile-recovery-targeted
  cancel-in-progress: false

jobs:
  qa-offline-recovery-only:
    if: ${{ github.repository == 'Nrzxl/hanna-conquest-downloads' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated Mobile QA branch at immutable SHA
        uses: actions/checkout@v7
        with:
          repository: Nrzxl/hanna-conquest-mobile
          ref: 66e17f3bb63c39d3c24572ce9145189e421b0139
          token: ${{ secrets.HANNA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Assert source pin and QA-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "66e17f3bb63c39d3c24572ce9145189e421b0139"
          test -s source/lib/sync/hanna_sync_qa_conflict.dart
          test -s source/test/hanna_sync_qa_conflict_test.dart
          test -s source/docs/HANNA_SYNC_QA_CONFLICT_GATE4.md
          test "$(git -C source merge-base HEAD 54fdf7cb97eba079eb662459c716f050a77f43f6)" = "54fdf7cb97eba079eb662459c716f050a77f43f6"
      - name: Set up Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Resolve Flutter packages
        working-directory: source
        run: flutter pub get
      - name: Verify Flutter analyzer
        working-directory: source
        run: flutter analyze
      - name: Execute only affected Gate 4 conflict/recovery tests
        working-directory: source
        run: flutter test test/hanna_sync_qa_conflict_test.dart --reporter expanded
      - name: Confirm non-deployment
        run: echo 'QA-only code/test validation. No APK, backend, merge, OTA, Release or personal data touched.'
