name: HANNA Android - Public Build

# Explicit, owner-only builds. Private Flutter source is never mirrored here.
# The only published artifact is the signed Android APK.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private HANNA source branch to validate
        required: true
        type: choice
        default: main
        options:
          - main
          - feat/mobile-0.4.6-smart-home
          - feat/mobile-0.4.5-achievement-hall
          - feat/mobile-0.4.4-conquest-route
      publish:
        description: Publish to the HANNA update feed (only from private main)
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hanna-public-builder
  cancel-in-progress: false

jobs:
  build:
    name: Validate HANNA source and optionally build signed APK
    if: ${{ github.actor == 'Nrzxl' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HANNA_UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/Nrzxl/hanna-conquest-downloads/main/update.json

    steps:
      - name: Check owner, publish branch and private-source access
        env:
          SOURCE_TOKEN: ${{ secrets.HANNA_SOURCE_READ_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SHOULD_PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_TOKEN" ]]; then
            echo "::error::Configure HANNA_SOURCE_READ_TOKEN as an Actions secret (fine-grained access to the private source, Contents read only)."
            exit 1
          fi
          if [[ "$SHOULD_PUBLISH" == "true" && "$SOURCE_REF" != "main" ]]; then
            echo "::error::Publication is allowed only after merging and validating the private main branch."
            exit 1
          fi

      - name: Checkout private HANNA source without mirroring it
        uses: actions/checkout@v7
        with:
          repository: Nrzxl/hanna-conquest-mobile
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.HANNA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Determine source version and next monotonic Android build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+/\1/p' source/pubspec.yaml | head -n 1)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid or missing source version."
            exit 1
          fi
          CURRENT_BUILD="$(
            gh api "repos/$GITHUB_REPOSITORY/contents/update.json" --jq .content |
            base64 --decode |
            python3 -c 'import json,sys; x=json.load(sys.stdin)["build"]; assert type(x) is int and x > 0; print(x)'
          )"
          NUMBER="$((CURRENT_BUILD + 1))"
          echo "HANNA_BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "HANNA_BUILD_NUMBER=$NUMBER" >> "$GITHUB_ENV"
          echo "HANNA_RELEASE_TAG=v$VERSION-b$NUMBER" >> "$GITHUB_ENV"
          echo "Next version: $VERSION, build $NUMBER (published build: $CURRENT_BUILD)."

      - name: Prepare original Android release signing
        if: ${{ inputs.publish }}
        env:
          HANNA_KEYSTORE_BASE64: ${{ secrets.HANNA_KEYSTORE_BASE64 }}
          HANNA_KEY_ALIAS: ${{ secrets.HANNA_KEY_ALIAS }}
          HANNA_KEY_PASSWORD: ${{ secrets.HANNA_KEY_PASSWORD }}
          HANNA_STORE_PASSWORD: ${{ secrets.HANNA_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$HANNA_KEYSTORE_BASE64" || -z "$HANNA_KEY_ALIAS" ||
                -z "$HANNA_KEY_PASSWORD" || -z "$HANNA_STORE_PASSWORD" ]]; then
            echo "::error::The original HANNA signing secrets must be configured in the public build repository. Never create a replacement keystore for an in-place update."
            exit 1
          fi
          printf '%s' "$HANNA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hanna-release.jks"
          chmod 600 "$RUNNER_TEMP/hanna-release.jks"
          test -s "$RUNNER_TEMP/hanna-release.jks"
          echo "HANNA_KEYSTORE_PATH=$RUNNER_TEMP/hanna-release.jks" >> "$GITHUB_ENV"
          echo "Original signing keystore loaded (keystore never uploaded)."

      - name: Resolve Flutter dependencies
        working-directory: source
        run: flutter pub get

      - name: Analyze Flutter source
        working-directory: source
        run: flutter analyze

      - name: Run all Flutter tests
        working-directory: source
        run: flutter test

      - name: Build signed Android APK with official update feed
        if: ${{ inputs.publish }}
        working-directory: source
        env:
          HANNA_KEY_ALIAS: ${{ secrets.HANNA_KEY_ALIAS }}
          HANNA_KEY_PASSWORD: ${{ secrets.HANNA_KEY_PASSWORD }}
          HANNA_STORE_PASSWORD: ${{ secrets.HANNA_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release \
            --build-name="$HANNA_BUILD_VERSION" \
            --build-number="$HANNA_BUILD_NUMBER" \
            --dart-define=HANNA_BUILD_VERSION="$HANNA_BUILD_VERSION" \
            --dart-define=HANNA_BUILD_NUMBER="$HANNA_BUILD_NUMBER" \
            --dart-define=HANNA_UPDATE_MANIFEST_URL="$HANNA_UPDATE_MANIFEST_URL"
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/HANNA-conquest.apk"
          test -s "$RUNNER_TEMP/HANNA-conquest.apk"
          sha256sum "$RUNNER_TEMP/HANNA-conquest.apk" | cut -d ' ' -f 1
          echo "Android APK built successfully. Private source and keystore are never uploaded."

      - name: Verify original signing certificate against public 0.4.3
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          CURRENT_FEED="$(gh api "repos/$REPO/contents/update.json" --jq .content | base64 --decode)"
          OLD_URL="$(printf '%s' "$CURRENT_FEED" | python3 -c 'import json,sys; print(json.load(sys.stdin)["apk_url"])')"
          OLD_SHA="$(printf '%s' "$CURRENT_FEED" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha256"])')"
          curl -fL --retry 2 --max-time 180 "$OLD_URL" -o "$RUNNER_TEMP/hanna-previous.apk"
          printf '%s  %s\n' "$OLD_SHA" "$RUNNER_TEMP/hanna-previous.apk" | sha256sum --check --status
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APK_SIGNER"
          OLD_CERT="$("$APK_SIGNER" verify --print-certs "$RUNNER_TEMP/hanna-previous.apk" | sed -nE 's/^Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)$/\1/p' | head -n 1)"
          NEW_CERT="$("$APK_SIGNER" verify --print-certs "$RUNNER_TEMP/HANNA-conquest.apk" | sed -nE 's/^Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)$/\1/p' | head -n 1)"
          if [[ -z "$OLD_CERT" || -z "$NEW_CERT" || "$OLD_CERT" != "$NEW_CERT" ]]; then
            echo "::error::APK signature mismatch. An in-place update would fail. Original signing keystore is required."
            exit 1
          fi
          echo "Verified APK signature matches current HANNA release; upgrade remains installable."

      - name: Publish signed APK and manifest to public HANNA releases
        if: ${{ inputs.publish && inputs.source_ref == 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          APK="$RUNNER_TEMP/HANNA-conquest.apk"
          test -s "$APK"
          test "$REPO" = "Nrzxl/hanna-conquest-downloads"
          SHA256="$(sha256sum "$APK" | cut -d ' ' -f 1)"
          if gh release view "$HANNA_RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$HANNA_RELEASE_TAG" "$APK" --repo "$REPO" --clobber
          else
            gh release create "$HANNA_RELEASE_TAG" "$APK" \
              --repo "$REPO" \
              --title "HANNA conquest Mobile $HANNA_BUILD_VERSION (build $HANNA_BUILD_NUMBER)" \
              --notes "HANNA conquest Mobile $HANNA_BUILD_VERSION. Signed APK only; source remains private."
          fi

          # Re-read the feed just before publishing. Never downgrade or
          # advertise a missing asset. Old versions stay available.
          FEED="$(gh api "repos/$REPO/contents/update.json")"
          OLD_BUILD="$(printf '%s' "$FEED" | python3 -c 'import base64,json,sys; x=json.load(sys.stdin); d=json.loads(base64.b64decode(x["content"])); print(int(d["build"]))')"
          if (( OLD_BUILD >= HANNA_BUILD_NUMBER )); then
            echo "::error::Update feed build advanced since this job started; refusing to downgrade."
            exit 1
          fi
          MANIFEST_SHA="$(printf '%s' "$FEED" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          URL="https://github.com/$REPO/releases/download/$HANNA_RELEASE_TAG/HANNA-conquest.apk"
          python3 -c 'import json,sys; json.dump({"version":sys.argv[1],"build":int(sys.argv[2]),"apk_url":sys.argv[3],"sha256":sys.argv[4],"notes":"Nova atualização da HANNA conquest Mobile disponível."},sys.stdout); print()' \
            "$HANNA_BUILD_VERSION" "$HANNA_BUILD_NUMBER" "$URL" "$SHA256" > "$RUNNER_TEMP/update.json"
          CONTENT="$(base64 -w0 "$RUNNER_TEMP/update.json")"
          gh api --method PUT "repos/$REPO/contents/update.json" \
            -f message="release: publish HANNA build $HANNA_BUILD_NUMBER" \
            -f content="$CONTENT" \
            -f sha="$MANIFEST_SHA" >/dev/null
          echo "Public signed APK and update feed published: $HANNA_RELEASE_TAG"

      - name: Validate-only completion
        if: ${{ !inputs.publish }}
        run: echo "Private HANNA branch analyzed and tested. No signing key, APK build or public update needed."
