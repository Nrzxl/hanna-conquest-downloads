name: HANNA Sync Gate 4.3 - Guided JSON v1 conflict receipts QA

on:
  push:
    branches: [qa/hanna-sync-guided-gate43]
    paths:
      - .github/workflows/hanna-sync-gate43-guided-wizard-qa.yml

permissions:
  contents: read

concurrency:
  group: hanna-sync-gate43-guided4-qa-apk-only
  cancel-in-progress: false

jobs:
  qa-isolated-debug:
    if: ${{ github.repository == 'Nrzxl/hanna-conquest-downloads' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HANNA_SYNC_QA_ISOLATED: "1"
      HANNA_SYNC_QA_CONFLICT: "1"
      HANNA_SYNC_QA_GUIDED_V4: "1"
    steps:
      - name: Checkout immutable Gate 4 guided Flutter code
        uses: actions/checkout@v7
        with:
          repository: Nrzxl/hanna-conquest-mobile
          ref: f10d609a6f26b50a00439c8fb88f564c1f0f2fdc
          token: ${{ secrets.HANNA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source

      - name: Verify source SHA and safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "f10d609a6f26b50a00439c8fb88f564c1f0f2fdc"
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("source/backend/public_client_config.json").read_text())
          assert cfg["url"] == "https://wbkfrldzuasicmtmndvd.supabase.co"
          assert cfg["publishable_key"].startswith("sb_publishable_")
          assert cfg["deployment_verified"] is False
          with open(__import__("os").environ["GITHUB_ENV"], "a") as out:
              out.write("HANNA_QA_PUBLISHABLE=" + cfg["publishable_key"] + "\n")
          print("Public key present; deployment_verified=false, no credentials copied.")
          PY
          test -s source/lib/sync/hanna_sync_qa_smoke.dart
          test -s source/test/hanna_sync_qa_smoke_test.dart
          test -s source/test/hanna_sync_gate2_projection_test.dart
          test -s source/lib/sync/hanna_sync_qa_collection_pull.dart
          test -s source/lib/sync/hanna_sync_qa_conflict.dart
          test -s source/lib/sync/hanna_sync_qa_conflict_panel.dart
          test -s source/lib/sync/hanna_sync_qa_guided_flow.dart
          test -s source/lib/sync/hanna_sync_qa_guided_panel.dart
          test -s source/test/hanna_sync_qa_conflict_test.dart
          test -s source/docs/HANNA_SYNC_QA_CONFLICT_GATE4.md
          test -s source/docs/HANNA_SYNC_WINDOWS_FEEDBACK.md
          grep -q "offlineIntentSha256" source/lib/sync/hanna_sync_qa_conflict.dart
          grep -q "qa/gate43" source/docs/HANNA_SYNC_QA_CONFLICT_GATE4.md
          grep -q 'guided4' source/android/app/build.gradle.kts
          grep -q 'HANNA_SYNC_GATE43_GUIDED' source/lib/sync/hanna_sync_qa_guided_flow.dart

      - name: Set up Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true

      - name: Resolve dependencies
        working-directory: source
        run: flutter pub get

      - name: Verify analyze and entire Flutter regression before build
        working-directory: source
        run: |
          flutter analyze
          flutter test test/hanna_sync_qa_conflict_test.dart --dart-define=HANNA_GUIDED_EXPORT_FIXTURES=true
          flutter test
          test -s build/qa_guided_fixtures/PREPARED.json
          test -s build/qa_guided_fixtures/COMPLETED_KEEP_ANDROID.json
          test -s build/qa_guided_fixtures/COMPLETED_KEEP_WINDOWS.json
          mkdir -p ../qa-out/fixtures
          cp build/qa_guided_fixtures/*.json ../qa-out/fixtures/

      - name: Build separately installable guided QA Android debug APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$HANNA_SYNC_QA_ISOLATED" = "1"
          test "$HANNA_SYNC_QA_CONFLICT" = "1"
          test "$HANNA_SYNC_QA_GUIDED_V4" = "1"
          flutter build apk --debug \
            --dart-define=HANNA_SYNC_SUPABASE_URL=https://wbkfrldzuasicmtmndvd.supabase.co \
            --dart-define=HANNA_SYNC_SUPABASE_PUBLISHABLE_KEY="$HANNA_QA_PUBLISHABLE" \
            --dart-define=HANNA_SYNC_EXPERIMENTAL_ENABLED=true \
            --dart-define=HANNA_SYNC_QA_SMOKE=true \
            --dart-define=HANNA_SYNC_QA_CONFLICT=true \
            --dart-define=HANNA_SYNC_QA_GUIDED=true
          test -s build/app/outputs/flutter-apk/app-debug.apk
          mkdir -p ../qa-out
          cp build/app/outputs/flutter-apk/app-debug.apk ../qa-out/HANNA_Sync_GATE43_GUIDED4_QA_debug.apk

      - name: Verify isolated package and write sanitized provenance
        shell: bash
        run: |
          set -euo pipefail
          APK=qa-out/HANNA_Sync_GATE43_GUIDED4_QA_debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.example.hanna_conquest_app.syncqa.guided4'"
          {
            echo 'HANNA Sync Gate 4.3 Guided v4 -- ISOLATED OFFLINE WIZARD DEBUG QA ONLY'
            echo 'Source SHA: f10d609a6f26b50a00439c8fb88f564c1f0f2fdc'
            echo "GitHub CI run: https://github.com/Nrzxl/hanna-conquest-downloads/actions/runs/$GITHUB_RUN_ID"
            echo 'Android applicationId: com.example.hanna_conquest_app.syncqa.guided4'
            echo 'Signing: DEBUG only (not compatible with original release)'
            echo 'HANNA_SYNC_EXPERIMENTAL_ENABLED=true, HANNA_SYNC_QA_SMOKE=true'
            echo 'Backend URL: wbkfrldzuasicmtmndvd.supabase.co (public only)'
            echo 'deployment_verified=false; Auth admission still required'
            echo 'Gate 1 transport validated independently; original APK not replaced'
            echo 'Gate 2 Android physical UI/persistence: PASS MANUAL (no screenshot in CI)'
            echo 'Gate 4.3 physical offline restart/CAS conflict/readback: NOT_RUN (CI only)'
            echo 'Older Gate QA v1/v2/v3 packages and data untouched; new guided4 package separate and debug-signed'
            echo 'Gate 4.3 Windows concurrent writer/final readback: NOT_RUN'
            echo 'Strict serializer fixtures (MOCK only; no physical evidence):'
            sha256sum qa-out/fixtures/*.json
            echo 'Dart-generated fixture JSON begin:'
            for file in qa-out/fixtures/*.json; do
              name=$(basename "$file")
              echo "GUIDED_FIXTURE_START:$name"
              cat "$file"
              echo "GUIDED_FIXTURE_END:$name"
            done
            sha256sum "$APK"
          } > qa-out/QA_BUILD_PROVENANCE.txt

      - name: Upload QA-only APK as workflow artifact (never a release or OTA)
        uses: actions/upload-artifact@v4
        with:
          name: HANNA-Sync-GATE43-GUIDED4-QA-isolated-${{ github.run_number }}
          path: qa-out/
          if-no-files-found: error
          retention-days: 7
