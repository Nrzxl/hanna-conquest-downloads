name: HANNA Sync Gate 4.3 - Guided Android QA PT-BR

on:
  push:
    branches: [qa/hanna-sync-conflict-gate4]
    paths:
      - .github/workflows/hanna-sync-gate43-guided-qa.yml

permissions:
  contents: read

concurrency:
  group: hanna-sync-gate43-guided-qa-apk-only
  cancel-in-progress: false

jobs:
  qa-isolated-debug:
    if: ${{ github.repository == 'Nrzxl/hanna-conquest-downloads' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HANNA_SYNC_QA_ISOLATED: "1"
      HANNA_SYNC_QA_CONFLICT: "1"
      HANNA_SYNC_QA_GUIDED: "1"
    steps:
      - name: Checkout immutable Gate 4 conflict Flutter code
        uses: actions/checkout@v7
        with:
          repository: Nrzxl/hanna-conquest-mobile
          ref: f469e09bfb8758406821cbf3e8c0069e08f9ece6
          token: ${{ secrets.HANNA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source

      - name: Verify source SHA and safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "f469e09bfb8758406821cbf3e8c0069e08f9ece6"
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("source/backend/public_client_config.json").read_text())
          assert cfg["url"] == "https://wbkfrldzuasicmtmndvd.supabase.co"
          assert cfg["publishable_key"].startswith("sb_publishable_")
          assert cfg["deployment_verified"] is False
          with open(__import__("os").environ["GITHUB_ENV"], "a") as out:
              out.write("HANNA_QA_PUBLISHABLE=" + cfg["publishable_key"] + "\n")
          print("Public key present; deployment_verified=false, no credentials copied.")
          PY
          test -s source/lib/sync/hanna_sync_qa_smoke.dart
          test -s source/test/hanna_sync_qa_smoke_test.dart
          test -s source/test/hanna_sync_gate2_projection_test.dart
          test -s source/lib/sync/hanna_sync_qa_collection_pull.dart
          test -s source/lib/sync/hanna_sync_qa_conflict.dart
          test -s source/lib/sync/hanna_sync_qa_conflict_panel.dart
          test -s source/test/hanna_sync_qa_conflict_test.dart
          test -s source/docs/HANNA_SYNC_QA_CONFLICT_GATE4.md
          test -s source/docs/HANNA_SYNC_WINDOWS_FEEDBACK.md
          grep -q "offlineIntentSha256" source/lib/sync/hanna_sync_qa_conflict.dart
          grep -q "HANNA_SYNC_GATE43_GUIDED" source/lib/sync/hanna_sync_qa_conflict.dart
          test -s source/lib/sync/hanna_sync_qa_guided_panel.dart
          grep -q "hanna.conquest/qa_guided" source/android/app/src/main/kotlin/com/example/hanna_conquest_app/MainActivity.kt
          grep -q "qa/gate43" source/docs/HANNA_SYNC_QA_CONFLICT_GATE4.md
          grep -q 'conflict3' source/android/app/build.gradle.kts

      - name: Set up Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true

      - name: Resolve dependencies
        working-directory: source
        run: flutter pub get

      - name: Verify analyze and entire Flutter regression before build
        working-directory: source
        run: |
          flutter analyze
          flutter test test/hanna_sync_qa_conflict_test.dart
          flutter test

      - name: Build separately installable conflict QA Android debug APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$HANNA_SYNC_QA_ISOLATED" = "1"
          test "$HANNA_SYNC_QA_CONFLICT" = "1"
          test "$HANNA_SYNC_QA_GUIDED" = "1"
          flutter build apk --debug \
            --dart-define=HANNA_SYNC_SUPABASE_URL=https://wbkfrldzuasicmtmndvd.supabase.co \
            --dart-define=HANNA_SYNC_SUPABASE_PUBLISHABLE_KEY="$HANNA_QA_PUBLISHABLE" \
            --dart-define=HANNA_SYNC_EXPERIMENTAL_ENABLED=true \
            --dart-define=HANNA_SYNC_QA_SMOKE=true \
            --dart-define=HANNA_SYNC_QA_CONFLICT=true \
            --dart-define=HANNA_SYNC_QA_GUIDED=true
          test -s build/app/outputs/flutter-apk/app-debug.apk
          mkdir -p ../qa-out
          cp build/app/outputs/flutter-apk/app-debug.apk ../qa-out/HANNA_Sync_GATE43_GUIDED_QA_debug.apk

      - name: Verify isolated package and write sanitized provenance
        shell: bash
        run: |
          set -euo pipefail
          APK=qa-out/HANNA_Sync_GATE43_GUIDED_QA_debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.example.hanna_conquest_app.syncqa.guided'"
          {
            echo 'HANNA Sync Gate 4.3 guided -- ISOLATED PT-BR DEBUG QA ONLY'
            echo 'Source SHA: f469e09bfb8758406821cbf3e8c0069e08f9ece6'
            echo "GitHub CI run: https://github.com/Nrzxl/hanna-conquest-downloads/actions/runs/$GITHUB_RUN_ID"
            echo 'Android applicationId: com.example.hanna_conquest_app.syncqa.guided'
            echo 'Signing: DEBUG only (not compatible with original release)'
            echo 'HANNA_SYNC_EXPERIMENTAL_ENABLED=true, HANNA_SYNC_QA_SMOKE=true, HANNA_SYNC_QA_GUIDED=true'
          echo 'guided report gate: HANNA_SYNC_GATE43_GUIDED schemaVersion=1'
          echo 'PREPARED pending=0 does NOT authorize a Windows write'
          echo 'Offline-ready proof is MANUAL on computer plus local journal, no flight-mode telemetry over Internet'
            echo 'Backend URL: wbkfrldzuasicmtmndvd.supabase.co (public only)'
            echo 'deployment_verified=false; Auth admission still required'
            echo 'Gate 1 transport validated independently; original APK not replaced'
            echo 'Gate 2 Android physical UI/persistence: PASS MANUAL (no screenshot in CI)'
            echo 'Gate 4.3 user airplane offline/manual confirmation, hosted CAS and Windows readback: NOT_RUN (CI only)'
            echo 'Personal HANNA 0.4.17 and QA v1/v2/v3 packages untouched; guided package isolated'
            echo 'Gate 4.3 Windows concurrent writer/final readback: NOT_RUN'
            sha256sum "$APK"
          } > qa-out/QA_BUILD_PROVENANCE.txt

      - name: Upload QA-only APK as workflow artifact (never a release or OTA)
        uses: actions/upload-artifact@v4
        with:
          name: HANNA-Sync-GATE43-GUIDED-QA-isolated-${{ github.run_number }}
          path: qa-out/
          if-no-files-found: error
          retention-days: 7
